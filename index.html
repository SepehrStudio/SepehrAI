<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sepehr AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #080b17;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1100px;
            height: 94vh;
            background: rgba(12, 16, 32, 0.95);
            backdrop-filter: blur(24px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .login-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 11, 23, 0.98);
            backdrop-filter: blur(40px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        .login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-card {
            background: rgba(18, 24, 46, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 44px;
            padding: 44px 48px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }

        .login-card .brand-icon {
            text-align: center;
            font-size: 52px;
            color: #64ffda;
            margin-bottom: 8px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .login-card .brand-title {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #64ffda, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .login-card .brand-sub {
            text-align: center;
            color: #5a6488;
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 28px;
            letter-spacing: 2px;
        }

        .login-card .powered-by {
            text-align: center;
            color: #3d4768;
            font-size: 12px;
            font-weight: 300;
            margin-top: 18px;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 16px;
            direction: ltr;
        }
        .login-card .powered-by strong {
            color: #64ffda;
            font-weight: 700;
            background: linear-gradient(135deg, #64ffda, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-card .powered-by i { color: #ffd700; margin: 0 2px; }

        .input-group { margin-bottom: 14px; }
        .input-group label {
            display: block;
            color: #8892b0;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            color: #f0f4ff;
            font-size: 15px;
            font-family: 'Vazirmatn', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: rgba(100, 255, 218, 0.2);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(100, 255, 218, 0.02);
        }

        .input-group input::placeholder { color: #2d3655; }

        .verify-box {
            background: rgba(100, 255, 218, 0.03);
            border: 1px dashed rgba(100, 255, 218, 0.08);
            border-radius: 16px;
            padding: 14px 20px;
            margin: 14px 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .verify-box .hint {
            color: #5a6488;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .verify-box .code {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #64ffda;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 16px;
            border-radius: 10px;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00b4d8, #7b2ffc);
            border: none;
            border-radius: 60px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 32px rgba(0, 180, 255, 0.12);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 48px rgba(0, 180, 255, 0.2);
        }
        .login-btn:active { transform: scale(0.97); }

        .login-error {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 24px;
            background: rgba(255, 107, 107, 0.05);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 107, 107, 0.05);
        }

        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; }

        .chat-header {
            padding: 14px 28px;
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chat-header .left { display: flex; align-items: center; gap: 16px; }

        .chat-header .brand { display: flex; align-items: center; gap: 10px; }
        .chat-header .brand i { font-size: 26px; color: #64ffda; }
        .chat-header .brand .name {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #64ffda, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .chat-header .brand .sub {
            font-weight: 300;
            font-size: 12px;
            -webkit-text-fill-color: #3d4768;
            background: none;
        }

        .chat-header .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ccd6f6;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 16px 4px 12px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .chat-header .user-info i { color: #64ffda; font-size: 14px; }
        .chat-header .user-info .email {
            color: #3d4768;
            font-size: 11px;
            direction: ltr;
        }

        .chat-header .user-info .vip-badge {
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            margin-right: 4px;
            display: none;
        }
        .chat-header .user-info .vip-badge.show {
            display: inline-block;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 5px #ffd700; }
            to { box-shadow: 0 0 20px #ff6b00, 0 0 40px #ffd700; }
        }

        .exit-btn {
            background: rgba(255, 70, 70, 0.06);
            border: 1px solid rgba(255, 70, 70, 0.06);
            color: #ff6b6b;
            padding: 8px 18px;
            border-radius: 60px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exit-btn:hover {
            background: rgba(255, 70, 70, 0.12);
            transform: scale(1.03);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar { width: 3px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(100, 255, 218, 0.12);
            border-radius: 10px;
        }

        .msg {
            max-width: 78%;
            padding: 14px 22px;
            border-radius: 22px;
            font-size: 14.5px;
            line-height: 1.8;
            animation: fadeInUp 0.3s ease;
            word-wrap: break-word;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            white-space: pre-wrap;
        }

        .msg.bot {
            align-self: flex-start;
            background: rgba(28, 36, 64, 0.7);
            border: 1px solid rgba(100, 255, 218, 0.04);
            color: #e6f1ff;
            border-bottom-left-radius: 6px;
        }

        .msg.bot .icon { margin-left: 8px; }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #1a264a, #25375e);
            border: 1px solid rgba(100, 180, 255, 0.06);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .msg.bot.vip-message {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.08), rgba(255, 107, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.03);
        }

        .msg.bot.vip-message .icon { color: #ffd700; }

        .msg .time {
            font-size: 9px;
            opacity: 0.25;
            margin-top: 5px;
            display: block;
        }

        .typing-indicator {
            align-self: flex-start;
            background: rgba(28, 36, 64, 0.5);
            padding: 12px 22px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4a5478;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .typing-dots span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #64ffda;
            border-radius: 50%;
            margin: 0 2px;
            animation: dotPulse 1.4s infinite both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-area {
            padding: 14px 28px 22px 28px;
            background: rgba(0, 0, 0, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 60px;
            padding: 14px 24px;
            font-size: 14.5px;
            font-family: 'Vazirmatn', sans-serif;
            color: #f0f4ff;
            outline: none;
            transition: 0.3s;
        }

        .input-area input::placeholder { color: #2d3655; font-weight: 300; }

        .input-area input:focus {
            border-color: rgba(100, 255, 218, 0.15);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 30px rgba(100, 255, 218, 0.01);
        }

        .input-area .send-btn {
            background: linear-gradient(135deg, #00b4d8, #7b2ffc);
            border: none;
            border-radius: 60px;
            padding: 14px 28px;
            color: white;
            font-weight: 700;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 6px 24px rgba(0, 180, 255, 0.08);
            white-space: nowrap;
        }

        .input-area .send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 32px rgba(0, 180, 255, 0.15);
        }
        .input-area .send-btn:active { transform: scale(0.95); }
        .input-area .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 640px) {
            .login-card { padding: 32px 20px; }
            .login-card .brand-title { font-size: 22px; }
            .chat-header { padding: 10px 14px; }
            .chat-header .brand .name { font-size: 16px; }
            .chat-header .brand i { font-size: 20px; }
            .chat-header .user-info .email { display: none; }
            .messages-area { padding: 16px; }
            .input-area { padding: 10px 14px 16px 14px; flex-wrap: wrap; }
            .input-area .send-btn { padding: 12px 18px; font-size: 13px; }
            .msg { max-width: 92%; font-size: 14px; padding: 12px 16px; }
            .verify-box .code { font-size: 20px; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper" id="app">
        <!-- ===== LOGIN ===== -->
        <div class="login-overlay" id="loginOverlay">
            <div class="login-card">
                <span class="brand-icon"><i class="fas fa-robot"></i></span>
                <div class="brand-title">Sepehr AI</div>
                <div class="brand-sub">هوش مصنوعی پاسخگو</div>

                <div class="powered-by"><i class="fas fa-bolt"></i> Powered by <strong>Sepehr Studio</strong> <i class="fas fa-crown" style="color: #ffd700;"></i></div>

                <div class="input-group">
                    <label><i class="fas fa-user"></i> نام کامل</label>
                    <input type="text" id="loginName" placeholder="نام خود را وارد کنید" />
                </div>
                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> ایمیل</label>
                    <input type="email" id="loginEmail" placeholder="example@gmail.com" />
                </div>
                <div class="input-group">
                    <label><i class="fas fa-lock"></i> رمز عبور</label>
                    <input type="password" id="loginPass" placeholder="حداقل ۶ کاراکتر" />
                </div>

                <div class="verify-box">
                    <span class="hint"><i class="fas fa-shield-alt"></i> کد تایید</span>
                    <span class="code" id="verifyCode">0000000000</span>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-edit"></i> کد را وارد کنید</label>
                    <input type="text" id="loginVerify" placeholder="کد ۱۰ رقمی" />
                </div>

                <button class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> ورود</button>
                <div class="login-error" id="loginError"></div>
            </div>
        </div>

        <!-- ===== CHAT ===== -->
        <div class="chat-container" id="chatContainer">
            <div class="chat-header">
                <div class="left">
                    <div class="brand">
                        <i class="fas fa-robot"></i>
                        <span class="name">Sepehr <span class="sub">AI</span></span>
                    </div>
                    <div class="user-info">
                        <i class="fas fa-user-circle"></i>
                        <span id="displayName">کاربر</span>
                        <span class="email" id="displayEmail">@email.com</span>
                        <span class="vip-badge" id="vipBadge">✦ VIP</span>
                    </div>
                </div>
                <button class="exit-btn" id="exitBtn"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>

            <div class="messages-area" id="messagesArea"></div>

            <div class="input-area">
                <input type="text" id="chatInput" placeholder="پیام خود را بنویسید... (x=خروج، clear=پاک کردن حافظه)" />
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i> ارسال</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  ⚙️ تنظیمات OpenRouter
        // ============================================================

        // ⚠️ هشدار: کلید API در سمت کلاینت قابل مشاهده است!
        // حتماً این کلید را باطل کن و یک کلید جدید بساز.
        const OPENROUTER_API_KEY = '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';
        
        // مدل انتخابی (اگر کار نکرد، این‌ها را امتحان کن):
        // 'qwen/qwen-2.5-7b-instruct:free'         ← بهترین برای فارسی
        // 'meta-llama/llama-3.2-3b-instruct:free'
        // 'google/gemma-2-9b-it:free'
        // 'mistralai/mistral-7b-instruct:free'
        const OPENROUTER_MODEL = 'inclusionai/ling-3.0-flash-fin:free';
        
        const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';

        // ============================================================
        //  متغیرها
        // ============================================================

        let userName = null;
        let userEmail = null;
        let isLoggedIn = false;
        let isVipUser = false;
        let conversationHistory = [];

        // ============================================================
        //  توابع کمکی
        // ============================================================

        function generateVerificationCode() {
            return Array.from({ length: 10 }, () => Math.floor(Math.random() * 10)).join('');
        }

        function validateEmail(email) {
            const allowedDomains = ['gmail.com', 'yahoo.com', 'email.com'];
            const pattern = new RegExp(`^[a-zA-Z0-9._%+-]+@(${allowedDomains.join('|')})$`);
            return pattern.test(email);
        }

        // ============================================================
        //  System Prompt
        // ============================================================

        function buildSystemPrompt() {
            let prompt = `تو "Sepehr AI" هستی، یک دستیار هوش مصنوعی فارسی‌زبان، مودب، دوستانه و مفید.
قواعد مهم:
- همیشه به زبان فارسی روان و محاوره‌ای جواب بده.
- پاسخ‌ها کوتاه، دقیق و مفید باشن (نه خیلی طولانی).
- از ایموجی در حد متعادل استفاده کن.
- اگر چیزی رو نمی‌دونی، صادقانه بگو.
- اگر کاربر درخواست کد یا محتوا داشت، دقیق و کامل بده.`;

            if (userName) {
                prompt += `\n\nنام کاربر فعلی: ${userName}`;
            }
            if (isVipUser) {
                prompt += `\n\n⭐ این کاربر "سپهر" هست و کاربر ویژه (VIP) محسوب می‌شه. با او صمیمانه‌تر، گرم‌تر و تشویق‌کننده‌تر صحبت کن.`;
            }
            return prompt;
        }

        // ============================================================
        //  فراخوانی OpenRouter
        // ============================================================

        async function callOpenRouter(userMessage) {
            // افزودن پیام کاربر به تاریخچه
            conversationHistory.push({
                role: 'user',
                content: userMessage
            });

            // محدود کردن تاریخچه به ۲۰ پیام آخر
            if (conversationHistory.length > 20) {
                conversationHistory = conversationHistory.slice(-20);
            }

            const messages = [
                { role: 'system', content: buildSystemPrompt() },
                ...conversationHistory
            ];

            try {
                const response = await fetch(OPENROUTER_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.origin || 'https://sepehr.ai',
                        'X-Title': 'Sepehr AI'
                    },
                    body: JSON.stringify({
                        model: OPENROUTER_MODEL,
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 1500
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    console.error('OpenRouter error:', response.status, errText);
                    
                    // پاک کردن پیام کاربر از تاریخچه در صورت خطا
                    conversationHistory.pop();

                    if (response.status === 401) {
                        return '❌ کلید API نامعتبر است یا منقضی شده.';
                    }
                    if (response.status === 402) {
                        return '❌ اعتبار حساب OpenRouter کافی نیست.';
                    }
                    if (response.status === 404) {
                        return '❌ مدل انتخابی در دسترس نیست. یک مدل دیگر امتحان کن.';
                    }
                    if (response.status === 429) {
                        return '⏳ تعداد درخواست‌ها زیاده. چند لحظه صبر کن.';
                    }
                    return `❌ خطا در ارتباط با سرور (کد ${response.status})`;
                }

                const data = await response.json();

                if (data.error) {
                    console.error('API error:', data.error);
                    conversationHistory.pop();
                    return `❌ خطای API: ${data.error.message || 'نامشخص'}`;
                }

                const reply = data.choices?.[0]?.message?.content;

                if (!reply) {
                    console.warn('Unexpected response:', data);
                    conversationHistory.pop();
                    return '❌ پاسخی از مدل دریافت نشد.';
                }

                // افزودن پاسخ مدل به تاریخچه
                conversationHistory.push({
                    role: 'assistant',
                    content: reply
                });

                return reply;

            } catch (error) {
                console.error('Network error:', error);
                conversationHistory.pop();
                return '❌ خطای شبکه! اتصال اینترنت خود را بررسی کن.';
            }
        }

        // ============================================================
        //  توابع ذخیره‌سازی
        // ============================================================

        function saveUserData() {
            localStorage.setItem('sepehr_user_data', JSON.stringify({
                userName, userEmail, isVipUser
            }));
        }

        function loadUserData() {
            const stored = localStorage.getItem('sepehr_user_data');
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    userName = data.userName || null;
                    userEmail = data.userEmail || null;
                    isVipUser = data.isVipUser || false;
                    return true;
                } catch (e) { return false; }
            }
            return false;
        }

        function clearUserData() {
            localStorage.removeItem('sepehr_user_data');
        }

        // ============================================================
        //  DOM refs
        // ============================================================

        const loginOverlay = document.getElementById('loginOverlay');
        const loginName = document.getElementById('loginName');
        const loginEmail = document.getElementById('loginEmail');
        const loginPass = document.getElementById('loginPass');
        const loginVerify = document.getElementById('loginVerify');
        const verifyCodeSpan = document.getElementById('verifyCode');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        const messagesArea = document.getElementById('messagesArea');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const exitBtn = document.getElementById('exitBtn');
        const displayName = document.getElementById('displayName');
        const displayEmail = document.getElementById('displayEmail');
        const vipBadge = document.getElementById('vipBadge');

        let currentCode = generateVerificationCode();
        verifyCodeSpan.textContent = currentCode;

        // ============================================================
        //  توابع پیام
        // ============================================================

        function addMessage(text, isUser = false, isBot = false, isVip = false) {
            const div = document.createElement('div');
            let className = `msg ${isUser ? 'user' : 'bot'}`;
            if (isBot && isVip) className += ' vip-message';
            div.className = className;

            if (isBot) {
                const icon = document.createElement('span');
                icon.className = 'icon';
                icon.textContent = isVip ? '👑' : '🤖';
                div.appendChild(icon);
            }

            div.appendChild(document.createTextNode(text));

            const time = document.createElement('span');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
            div.appendChild(time);

            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <span>Sepehr AI</span>
                <span class="typing-dots">
                    <span></span><span></span><span></span>
                </span>
            `;
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ============================================================
        //  پردازش ورودی کاربر
        // ============================================================

        async function processUserInput(text) {
            const trimmed = text.trim();
            if (!trimmed) return;

            addMessage(trimmed, true, false);

            // دستور خروج
            if (trimmed.toLowerCase() === 'x') {
                addMessage(`خداحافظ ${userName || 'کاربر'}! 👋`, false, true, isVipUser);
                setTimeout(() => logout(), 1500);
                return;
            }

            // دستور پاک کردن حافظه
            if (trimmed.toLowerCase() === 'clear' || trimmed === 'پاک کن') {
                conversationHistory = [];
                addMessage('🧹 حافظه گفتگو پاک شد!', false, true, isVipUser);
                return;
            }

            // غیرفعال کردن دکمه ارسال
            sendBtn.disabled = true;
            showTyping();

            const reply = await callOpenRouter(trimmed);

            hideTyping();
            addMessage(reply, false, true, isVipUser);
            sendBtn.disabled = false;
            chatInput.focus();
        }

        // ============================================================
        //  لاگین / خروج
        // ============================================================

        function login() {
            const name = loginName.value.trim();
            const email = loginEmail.value.trim();
            const pass = loginPass.value.trim();
            const verify = loginVerify.value.trim();

            loginError.textContent = '';
            loginError.style.color = '#ff6b6b';

            if (!name || name.length < 2) {
                loginError.textContent = '❌ لطفاً نام معتبر وارد کنید (حداقل ۲ حرف)!';
                return;
            }
            if (!validateEmail(email)) {
                loginError.textContent = '❌ ایمیل نامعتبر! فقط دامنه‌های @gmail.com، @yahoo.com و @email.com مجاز است!';
                return;
            }
            if (pass.length < 6) {
                loginError.textContent = '❌ رمز عبور باید حداقل ۶ کاراکتر باشد!';
                return;
            }
            if (verify !== currentCode) {
                loginError.textContent = '❌ کد تایید اشتباه است! کد جدید ارسال شد.';
                currentCode = generateVerificationCode();
                verifyCodeSpan.textContent = currentCode;
                loginVerify.value = '';
                return;
            }

            // چک VIP (مخفی)
            const isVip = (name === 'سپهر' || name.toLowerCase() === 'sepehr') &&
                          email === 's75577947@gmail.com' &&
                          pass === 'sepehr.1394';

            userName = name;
            userEmail = email;
            isLoggedIn = true;
            isVipUser = isVip;
            conversationHistory = []; // ریست حافظه

            saveUserData();
            displayName.textContent = userName;
            displayEmail.textContent = userEmail;

            if (isVipUser) vipBadge.classList.add('show');
            else vipBadge.classList.remove('show');

            loginOverlay.classList.add('hidden');
            messagesArea.innerHTML = '';

            setTimeout(() => {
                if (isVipUser) {
                    addMessage(`👑 سلام سپهر عزیز!`, false, true, true);
                    addMessage(`🌟 به Sepehr AI خوش آمدید!`, false, true, true);
                    addMessage(`💫 هر سوالی داری بپرس، من اینجام!`, false, true, true);
                    addMessage(`🔑 دستورها: x=خروج | clear=پاک کردن حافظه`, false, true, true);
                } else {
                    addMessage(`🤖 سلام ${userName} عزیز!`, false, true);
                    addMessage(`📧 به Sepehr AI خوش آمدید!`, false, true);
                    addMessage(`📝 هر سوالی داری بپرس`, false, true);
                    addMessage(`🔑 دستورها: x=خروج | clear=پاک کردن حافظه`, false, true);
                }
            }, 300);
        }

        function logout() {
            isLoggedIn = false;
            userName = null;
            userEmail = null;
            isVipUser = false;
            conversationHistory = [];
            vipBadge.classList.remove('show');
            clearUserData();

            loginOverlay.classList.remove('hidden');
            messagesArea.innerHTML = '';
            currentCode = generateVerificationCode();
            verifyCodeSpan.textContent = currentCode;
            loginVerify.value = '';
            loginError.textContent = '';
            loginName.value = '';
            loginEmail.value = '';
            loginPass.value = '';
        }

        // ============================================================
        //  لاگین خودکار
        // ============================================================

        function tryAutoLogin() {
            if (loadUserData() && userName && userEmail) {
                isLoggedIn = true;
                displayName.textContent = userName;
                displayEmail.textContent = userEmail;

                if (isVipUser) vipBadge.classList.add('show');
                else vipBadge.classList.remove('show');

                loginOverlay.classList.add('hidden');
                messagesArea.innerHTML = '';
                conversationHistory = [];

                setTimeout(() => {
                    if (isVipUser) {
                        addMessage(`👑 سلام دوباره سپهر عزیز!`, false, true, true);
                        addMessage(`🌟 خوش برگشتی!`, false, true, true);
                        addMessage(`💫 هر سوالی داری بپرس!`, false, true, true);
                    } else {
                        addMessage(`🤖 سلام دوباره ${userName} عزیز!`, false, true);
                        addMessage(`📝 هر سوالی داری بپرس`, false, true);
                    }
                }, 300);

                return true;
            }
            return false;
        }

        // ============================================================
        //  رویدادها
        // ============================================================

        loginBtn.addEventListener('click', login);
        loginVerify.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        sendBtn.addEventListener('click', () => {
            const text = chatInput.value.trim();
            if (text) {
                chatInput.value = '';
                processUserInput(text);
            }
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        exitBtn.addEventListener('click', logout);

        // ============================================================
        //  اجرا
        // ============================================================

        tryAutoLogin();

        console.log('🔑 اطلاعات VIP:');
        console.log('👤 نام: سپهر');
        console.log('📧 ایمیل: s75577947@gmail.com');
        console.log('🔒 رمز: sepehr.1394');
    </script>
</body>
</html>
